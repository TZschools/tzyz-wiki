  <link rel="stylesheet" href="//fastly.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    /* 封面布局：左对齐 + 首行缩进 2 字符 */
    section.cover .cover-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
      text-align: left;          /* 覆盖 docsify 默认的 center */
    }
    section.cover .cover-main > p {
      max-width: 720px;
      margin: 0 auto 1em;
      text-align: left;
      line-height: 1.9;
      text-indent: 2em;          /* 首行缩进 2 字符 */
    }
    /* 最后一个段落是按钮，居中且不缩进 */
    section.cover .cover-main > p:last-child {
      text-align: center;
      text-indent: 0;
      margin-top: 1.5rem;
    }
    /* 标题居中，加粗加大 */
    section.cover h1 {
      text-align: center;
      font-size: 3rem;          /* 桌面从 2.5rem → 3rem */
      font-weight: 700;         /* 从 300（细体）→ 700（粗体） */
      letter-spacing: 0.05em;   /* 字间距撑开，更醒目 */
      margin-bottom: 1.25rem;   /* 标题到正文的间距：原 2.5rem → 1.25rem（-50%） */
    }
    /* 平板以下缩小一档 */
    @media (max-width: 768px) {
      section.cover h1 {
        font-size: 2.25rem;     /* 从 1.75 → 2.25 */
      }
    }
    /* 手机再缩一档 */
    @media (max-width: 480px) {
      section.cover h1 {
        font-size: 1.85rem;     /* 从 1.5 → 1.85 */
      }
    }
    /* 引用 / 列表 兜底也左对齐 */
    section.cover ul,
    section.cover blockquote {
      max-width: 720px;
      text-align: left;
    }
    /* 列表项本身不缩进（避免和项目符号叠加） */
    section.cover li {
      text-indent: 0;
    }
  </style>

  <link rel="icon" href="./favicon.ico" />
  <link rel="shortcut icon" href="./favicon.ico" />

        name: '滕州一中校园百科',

        // 侧边栏支持，默认加载_sidebar.md

        loadNavbar: true,
        // 封面支持，默认加载_coverpage.md

        // 最大支持渲染的标题层级
        maxLevel: 5,
        // 自定义侧边栏后默认不会再生成目录，设置生成目录的最大层级
        subMaxLevel: 4,
        // 小屏设备下合并导航栏到侧边栏
        mergeNavbar: false,

        //搜索相关设置
        search: {
            maxAge: 86400000,// 过期时间，单位毫秒，默认一天
            paths: 'auto',// 注意：仅适用于 paths: 'auto' 模式
            placeholder: '搜索',              
            // 支持本地化
            placeholder: {
                '/zh-cn/': '搜索',
                '/': '点击搜索'
            },
            noData: '找不到结果',
            depth: 4,
            hideOtherSidebarContent: false,
            namespace: 'TZEZ-Guide',
        },
        
        //字数统计相关设置
        count:{

            color:'rgb(90,90,90)',

    }
